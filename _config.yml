title: "Abhyuday Mishra"
email: "abhymishrgkp@gmail.com"
description: "Abhyuday Mishra’s research portfolio: scientific machine learning, neural operators, quantum computing, qudit simulation, and knot recognition."
url: "https://abhyudaymishr.github.io"
baseurl: ""
timezone: "Asia/Kolkata"
repo_url: "https://github.com/abhyudaymishr/abhyudaymishr.github.io"
repo_branch: "main"
locale: "en_US"
default_image: "/assets/images/seo-card.png"
keywords:
  - Machine Learning
  - Machine Learning Engineering
  - Quantum Simulation
  - Quantum Computing
  - Scientific Machine Learning
  - Neural Operators
  - Qudits
  - Knot Theory
  - Topological Learning
  - Spatiotemporal ML
  - Model Context Protocol
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
permalink: /blog/:year/:month/:day/:title/

author:
  name: "Abhyuday Mishra"
  given_name: "Abhyuday"
  family_name: "Mishra"
  job_title: "Computer Science and Engineering Student"
  affiliation: "National Forensic Sciences University, Gandhinagar"
  role: "Quantum Computing | Scientific Machine Learning"
  summary: "Abhyuday Mishra is a Computer Science and Engineering student at NFSU Gandhinagar with research experience at IIT Madras, working on machine learning systems, quantum simulation, and scientific computing."
  github: "abhyudaymishr"
  linkedin: "https://www.linkedin.com/in/abhyuday-mishr-97a9002a5/"

collections:
  projects:
    output: true
    permalink: /projects/:path/
  publications:
    output: true
    permalink: /publications/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Presentation, source utilities, and checks are kept out of the public artifact.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - tests
  - node_modules
  - package.json
  - package-lock.json
  - vendor
  - .bundle
  - .github
  - docs
  - seo-audit.json

