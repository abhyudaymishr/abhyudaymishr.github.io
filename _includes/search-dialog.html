<dialog class="search-dialog" aria-labelledby="search-title" data-search-dialog>
  <div class="search-dialog__header"><h2 id="search-title">Find something interesting.</h2><button class="icon-button" type="button" data-close-search aria-label="Close search">{% include icon.html name='close' %}</button></div>
  <form role="search" action="{{ '/search/' | relative_url }}" data-search-form><label class="sr-only" for="dialog-query">Search projects, publications, and notes</label><div class="search-field">{% include icon.html name='search' %}<input id="dialog-query" type="search" name="q" placeholder="Try quantum, geometry, or Oculon…" autocomplete="off" maxlength="200" data-search-input><button class="button button--small" type="submit">Search</button></div></form>
  <p class="search-status" role="status" data-search-status>Search projects, publications, and research notes.</p><div class="search-results" data-search-results></div><a class="text-link" href="{{ '/projects/' | relative_url }}">Browse all projects {% include icon.html name='arrow' %}</a>
</dialog>
