<article class="note-card"><a class="note-card__link" href="{{ include.post.url | relative_url }}"><div class="note-card__meta"><span>{{ include.post.category | default: 'Research note' }}</span><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%d %b %Y' }}</time></div><h3>{{ include.post.title }}</h3><p>{{ include.post.description | default: include.post.excerpt | strip_html | normalize_whitespace | truncate: 165 }}</p><span class="card-action">Read note {% include icon.html name='arrow' %}</span></a></article>
